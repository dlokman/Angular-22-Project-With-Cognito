AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Customer Support Workshop prerequisites — Cognito, Lambda warranty check, and SSM parameters'
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Cognito Configuration
        Parameters:
          - UserPoolName
          - WebAppClientName

Parameters:

  UserPoolName:
    Type: String
    Default: 'Demo2UserPool'
    Description: 'Name of the Cognito User Pool'

  WebAppClientName:
    Type: String
    Default: 'WebClient'
    Description: 'Name of the Cognito User Pool Web Application Client'

Resources:

  # ============================================================
  # Cognito Resources
  # ============================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref UserPoolName
      MfaConfiguration: 'OFF'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      UsernameAttributes:
        - email  # <--- Use email as username
      AutoVerifiedAttributes:
        - email  # <--- Auto-verify email if you want to skip confirmation step
      Policies:
            SignInPolicy:
              AllowedFirstAuthFactors:
                - PASSWORD
                - EMAIL_OTP

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Administrator group
      UserPoolId: !Ref UserPool
      Precedence: 1  # Higher priority (lower number = higher precedence)

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      Description: Regular User group
      UserPoolId: !Ref UserPool
      Precedence: 2

  WebUserPoolClient:
    DependsOn: ResourceServer
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Ref WebAppClientName
      UserPoolId: !Ref UserPool
      GenerateSecret: false  # Don't use secret for SPA or web apps
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - !Join
            - ''
            - - 'resource-server-'
              - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
              - '/read'
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - http://localhost:4200/auth/callback
      LogoutURLs:
        - http://localhost:4200/logout
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 5
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !Join
        - '-'
        - - 'resource-server'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Name: !Join
        - '-'
        - - 'Resource Server '
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Scopes:
        - ScopeName: 'read'
          ScopeDescription: 'An example scope created by Amazon Cognito quick start'

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2
      Domain: !Join
        - ''
        - - !Ref 'AWS::Region'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn:
      - UserPoolDomain
      - WebUserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebUserPoolClient
      UseCognitoProvidedValues: true

  # ============================================================
  # Warranty Check Lambda Function (used in Lab 3 — Gateway)
  # ============================================================

  WarrantyCheckLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: workshop-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  WarrantyCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: workshop-warranty-check
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt WarrantyCheckLambdaRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import json

          WARRANTIES = {
              "PROD-001": {"product": "Wireless Headphones", "warranty_months": 12, "status": "active", "expires": "2027-03-01"},
              "PROD-002": {"product": "Smart Watch", "warranty_months": 24, "status": "active", "expires": "2028-01-15"},
              "PROD-003": {"product": "Laptop Stand", "warranty_months": 6, "status": "expired", "expires": "2026-01-01"},
              "PROD-004": {"product": "USB-C Hub", "warranty_months": 12, "status": "active", "expires": "2027-06-20"},
          }

          def handler(event, context):
              product_id = event.get("product_id", "").upper()
              if product_id in WARRANTIES:
                  return {"statusCode": 200, "body": json.dumps(WARRANTIES[product_id])}
              return {"statusCode": 404, "body": json.dumps({"error": f"No warranty found for {product_id}"})}

  # ============================================================
  # Refund Processing Lambda Function (used in Lab 7 — Policies)
  # ============================================================

  RefundLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: workshop-refund-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  RefundFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: workshop-process-refund
      Runtime: python3.13
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt RefundLambdaRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import json

          def handler(event, context):
              amount = event.get("amount", 0)
              order_id = event.get("order_id", "unknown")
              reason = event.get("reason", "not specified")

              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "status": "approved",
                      "order_id": order_id,
                      "refund_amount": amount,
                      "reason": reason,
                      "message": f"Refund of ${amount} for order {order_id} processed successfully"
                  })
              }

  # ============================================================
  # SSM Parameters — Cognito
  # ============================================================

  CognitoWebClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/web_client_id
      Type: String
      Value: !Ref WebUserPoolClient
      Description: Cognito client ID for web app
      Tags:
        Application: CustomerSupport

  UserPoolIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/pool_id
      Type: String
      Value: !Ref UserPool
      Description: Cognito client ID
      Tags:
        Application: CustomerSupport

  CognitoAuthScopeParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/cognito_auth_scope
      Type: String
      Value: !Join
        - ''
        - - 'resource-server-'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          - '/read'
      Description: OAuth2 scope for Cognito auth
      Tags:
        Application: CustomerSupport

  CognitoDiscoveryURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/cognito_discovery_url
      Type: String
      Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration'
      Description: OAuth2 Discovery URL
      Tags:
        Application: CustomerSupport

  CognitoTokenURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/cognito_token_url
      Type: String
      Value: !Join
        - ''
        - - !Sub 'https://${AWS::Region}'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          - !Sub '.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
      Description: OAuth2 Token URL
      Tags:
        Application: CustomerSupport

  CognitoAuthorizeURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/cognito_auth_url
      Type: String
      Value: !Join
        - ''
        - - !Sub 'https://${AWS::Region}'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          - !Sub '.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize'
      Description: OAuth2 Token URL
      Tags:
        Application: CustomerSupport

  CognitoDomainParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/cognito_domain
      Type: String
      Value: !Join
        - ''
        - - !Sub 'https://${AWS::Region}'
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
          - !Sub '.auth.${AWS::Region}.amazoncognito.com'
      Description: Cognito hosted domain for OAuth2
      Tags:
        Application: CustomerSupport

  # ============================================================
  # SSM Parameter — Warranty Check Lambda ARN (used in Lab 3)
  # ============================================================

  WarrantyCheckLambdaArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/warranty_check_lambda_arn
      Type: String
      Value: !GetAtt WarrantyCheckFunction.Arn
      Description: ARN of the warranty check Lambda function for AgentCore Gateway
      Tags:
        Application: CustomerSupport

  # ============================================================
  # SSM Parameter — Refund Lambda ARN (used in Lab 7)
  # ============================================================

  RefundLambdaArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/customersupport/agentcore/refund_lambda_arn
      Type: String
      Value: !GetAtt RefundFunction.Arn
      Description: ARN of the refund processing Lambda function for AgentCore Gateway
      Tags:
        Application: CustomerSupport
