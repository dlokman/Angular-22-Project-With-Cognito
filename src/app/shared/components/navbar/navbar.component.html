<nav id="app-toolbar" class="sticky top-0 z-1000! sm:h-[60px]">
  <div class="mx-auto px-2 sm:px-6 lg:px-8">
    <div class="relative flex items-center justify-between h-15">

      <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
        <!-- Mobile menu button-->
        <button id="mobile-menu-button" type="button" class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:ring-2 focus:ring-white focus:outline-hidden focus:ring-inset" aria-controls="mobile-menu" [attr.aria-expanded]="isMobileMenuOpen()" (click)="toggleMobileMenu()">
          <span class="absolute -inset-2"></span>
          <span class="sr-only">Open main menu</span>
            <!--
              Icon when menu is closed.

              Menu open: "hidden", Menu closed: "block"
            -->
            <svg id="menu-closed-icon" class="block size-6" [class.hidden]="isMobileMenuOpen()" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
            <!--
              Icon when menu is open.

              Menu open: "block", Menu closed: "hidden"
            -->
            <svg id="menu-open-icon" class="hidden size-6" [class.hidden]="!isMobileMenuOpen()" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" data-slot="icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
      </div>

      <!-- Desktop -->
      <div class="flex flex-1 items-center justify-start sm:items-stretch sm:justify-start">
        <div class="flex shrink-0 items-center pl-[40px] sm:pl-0">
          <img  ngSrc="angular-icon.png" width="36" height="36" priority alt="Your Company">
          <span class="header-text ml-[8px] sm:ml-[10px]">Chatbot Demo</span>
        </div>
        <div class="hidden sm:ml-6 sm:block">
          <div class="flex space-x-4">
            <!--  Current:  "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-gray-700 hover:text-white" -->
            <a routerLink="/chat-1" routerLinkActive="bg-gray-900 text-white" class="rounded-md  bg-gray-900  px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white ml-5 mr-4" aria-current="page">Restaurant Agent</a>
            <a routerLink="/diagram-1" routerLinkActive="bg-gray-900 text-white" class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Architecture Diagram</a>
            <a routerLink="/chat-2" routerLinkActive="bg-gray-900 text-white" class="rounded-md  bg-gray-900  px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white ml-5 mr-4" aria-current="page">Flight Booking Agent</a>
            <a routerLink="/diagram-2" routerLinkActive="bg-gray-900 text-white" class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Architecture Diagram</a>
            <a routerLink="/playground" routerLinkActive="bg-gray-900 text-white" class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Playground</a>
          </div>
        </div>
      </div>

      <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
       @if (userData().userData?.['name']; as displayName) {
           <span class="user-name">{{ displayName }}</span>
           <!-- <fa-icon [icon]="faCircleUser" size="lg"></fa-icon> -->
        }
        <a href="#" class="btn-primary py-0.75! hover:bg-[oklch(0.49_0.08_272.52)]!" (click)="logout($event)">Sign out</a>
      </div>

    </div>
  </div>

  <!-- Mobile menu, show/hide based on menu state. -->
  <div class="hidden sm:hidden"  [class.hidden]="!isMobileMenuOpen()" id="mobile-menu">
    <div class="space-y-1 px-2 pt-2 pb-3">
      <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-gray-700 hover:text-white" -->
      <a routerLink="/chat-1" routerLinkActive="bg-gray-900 text-white" class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white" aria-current="page">Restaurant Agent</a>
      <a routerLink="/diagram-1" routerLinkActive="bg-gray-900 text-white" class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Architecture Diagram</a>
      <a routerLink="/chat-2" routerLinkActive="bg-gray-900 text-white" class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white" aria-current="page">Flight Booking Agent</a>
      <a routerLink="/diagram-2" routerLinkActive="bg-gray-900 text-white" class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Architecture Diagram</a>
      <a routerLink="/playground" routerLinkActive="bg-gray-900 text-white" class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Playground</a>
    </div>
  </div>
</nav>
