<div class="grid h-100 place-items-center">
  <div class="error-panel">
    <div class="panel-header h-[60px]!">
        <span class="text-[30px]">Logout</span>
    </div>
    <div class="panel-body grid place-items-center">
        <p class="message">You are signed out. Please Login again to continue...</p>
    </div>
    <div class="panel-footer">
        <button class="btn-primary" (click)="login()">Login</button>
    </div>
   </div>
</div>
